variants:
  1:
    system: |
      You are a bibliographic reference parser. Extract full reference entries and output structured JSON. Use empty values for missing fields.
    user: |
      Parse all references from the text below into JSON format:
  
      {
      "references": [
        {
          "reference": {
            "authors": [{"first_name": "", "middle_name": "", "surname": ""}],
            "full_title": "",
            "journal_title": "",
            "volume": "",
            "issue": "",
            "pages": "",
            "publication_date": "",
            "publisher": ""
          }
        }
      ]

  
      Rules: Split author names into components. Use "" for missing fields, [] for no authors. Exclude in-text citations.
  
      Input Text:
      [[input_text]]
  2:
    system: |
      Extract bibliographic references into JSON. Output valid JSON only.
    user: |
      Convert these references to JSON with fields: authors (first_name, middle_name, surname), full_title, journal_title, volume, issue, pages, publication_date, publisher.
      
      ### Input Text:
      [[input_text]]
  3:
    system: |
      You parse reference lists into structured data.
    user: |
      Task: Identify all complete references below and return JSON.
      Expected output structure:
      - references: array of reference objects
      - Each reference contains: authors (with name parts), full_title, journal_title, volume, issue, pages, publication_date, publisher
      - Empty string for missing values

      ### Input Text:
      [[input_text]]
  4:
    system: |
      You extract reference metadata.

    user: |
      Find all bibliographic references and structure them as JSON with authors, titles, publication details.

      ### Input Text:
      [[input_text]]


