services:
  # Redis - Message broker and job metadata store
  redis:
    image: redis:7-alpine
    container_name: citation-index-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - citation-net

  # FastAPI - API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citation-index-api
    command: uvicorn citation_index.api:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      # Host port 8000 is reserved for the MinerU oc port-forward.
      - "${CITATION_INDEX_PORT:-8001}:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - STORAGE_ROOT=/app/storage
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://localhost:8001/v1}
      - LLM_MODEL_MEDIUM_INTELLIGENCE=${LLM_MODEL_MEDIUM_INTELLIGENCE:-Qwen3.6-27B}
      - LLM_MODEL_HIGH_INTELLIGENCE=${LLM_MODEL_HIGH_INTELLIGENCE:-your-model-name}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180.0}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - LLM_ENABLE_THINKING=${LLM_ENABLE_THINKING:-false}
      - LLM_MAX_CONCURRENT=${LLM_MAX_CONCURRENT:-4}
      - LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_PARSING=${LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_PARSING:-30.0}
      - LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_EXTRACTION=${LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_EXTRACTION:-90.0}
      - LLM_FIRST_TOKEN_TIMEOUT_END_TO_END=${LLM_FIRST_TOKEN_TIMEOUT_END_TO_END:-90.0}
      - LLM_TIMEOUT_REFERENCE_PARSING=${LLM_TIMEOUT_REFERENCE_PARSING:-300.0}
      - GROBID_ENDPOINT=${GROBID_ENDPOINT:-http://grobid:8070}
      - GROBID_TIMEOUT=${GROBID_TIMEOUT:-180.0}
      - MINERU_ENDPOINT=${MINERU_DOCKER_ENDPOINT:-http://host.docker.internal:8000}
      - MINERU_TIMEOUT=${MINERU_TIMEOUT:-1200.0}
      - MINERU_BACKEND=${MINERU_BACKEND:-vlm-auto-engine}
      - WORKER_RESULT_TTL=${WORKER_RESULT_TTL:-3600}
      - JOB_METADATA_TTL=${JOB_METADATA_TTL:-86400}
      - TIMEOUT_TEXT_EXTRACTION=${TIMEOUT_TEXT_EXTRACTION:-1500}
      - TIMEOUT_REFERENCE_EXTRACTION=${TIMEOUT_REFERENCE_EXTRACTION:-1500}
      - TIMEOUT_REFERENCE_PARSING=${TIMEOUT_REFERENCE_PARSING:-2700}
      - TIMEOUT_CITATION_LINKING=${TIMEOUT_CITATION_LINKING:-600}
    volumes:
      - ./storage:/app/storage
      - ./prompts:/app/prompts
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - citation-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # RQ Workers - Default queue (text extraction, GROBID parsing)
  # Fast tasks (~30s-2min), low replica count
  worker-default:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m citation_index.worker --queues default
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - STORAGE_ROOT=/app/storage
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://localhost:8001/v1}
      - LLM_MODEL_MEDIUM_INTELLIGENCE=${LLM_MODEL_MEDIUM_INTELLIGENCE:-Qwen3.6-27B}
      - LLM_MODEL_HIGH_INTELLIGENCE=${LLM_MODEL_HIGH_INTELLIGENCE:-your-model-name}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180.0}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - LLM_ENABLE_THINKING=${LLM_ENABLE_THINKING:-false}
      - LLM_MAX_CONCURRENT=${LLM_MAX_CONCURRENT:-4}
      - LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_PARSING=${LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_PARSING:-30.0}
      - LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_EXTRACTION=${LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_EXTRACTION:-90.0}
      - LLM_FIRST_TOKEN_TIMEOUT_END_TO_END=${LLM_FIRST_TOKEN_TIMEOUT_END_TO_END:-90.0}
      - LLM_TIMEOUT_REFERENCE_PARSING=${LLM_TIMEOUT_REFERENCE_PARSING:-300.0}
      - GROBID_ENDPOINT=${GROBID_ENDPOINT:-http://grobid:8070}
      - GROBID_TIMEOUT=${GROBID_TIMEOUT:-180.0}
      - MINERU_ENDPOINT=${MINERU_DOCKER_ENDPOINT:-http://host.docker.internal:8000}
      - MINERU_TIMEOUT=${MINERU_TIMEOUT:-1200.0}
      - MINERU_BACKEND=${MINERU_BACKEND:-vlm-auto-engine}
      - WORKER_RESULT_TTL=${WORKER_RESULT_TTL:-3600}
      - JOB_METADATA_TTL=${JOB_METADATA_TTL:-86400}
      - TIMEOUT_TEXT_EXTRACTION=${TIMEOUT_TEXT_EXTRACTION:-1500}
      - TIMEOUT_REFERENCE_EXTRACTION=${TIMEOUT_REFERENCE_EXTRACTION:-1500}
      - TIMEOUT_REFERENCE_PARSING=${TIMEOUT_REFERENCE_PARSING:-2700}
      - TIMEOUT_CITATION_LINKING=${TIMEOUT_CITATION_LINKING:-600}
    volumes:
      - ./storage:/app/storage
      - ./prompts:/app/prompts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - citation-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      replicas: 2

  # RQ Workers - LLM tasks (reference extraction/parsing)
  # Slow tasks (~10-15min), HIGH replica count to drain queue
  # vLLM handles request batching; worker replicas are the concurrency limit.
  worker-llm:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m citation_index.worker --queues llm-tasks
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - STORAGE_ROOT=/app/storage
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://localhost:8001/v1}
      - LLM_MODEL_MEDIUM_INTELLIGENCE=${LLM_MODEL_MEDIUM_INTELLIGENCE:-Qwen3.6-27B}
      - LLM_MODEL_HIGH_INTELLIGENCE=${LLM_MODEL_HIGH_INTELLIGENCE:-your-model-name}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180.0}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - LLM_ENABLE_THINKING=${LLM_ENABLE_THINKING:-false}
      - LLM_MAX_CONCURRENT=${LLM_MAX_CONCURRENT:-4}
      - LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_PARSING=${LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_PARSING:-30.0}
      - LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_EXTRACTION=${LLM_FIRST_TOKEN_TIMEOUT_REFERENCE_EXTRACTION:-90.0}
      - LLM_FIRST_TOKEN_TIMEOUT_END_TO_END=${LLM_FIRST_TOKEN_TIMEOUT_END_TO_END:-90.0}
      - LLM_TIMEOUT_REFERENCE_PARSING=${LLM_TIMEOUT_REFERENCE_PARSING:-300.0}
      - GROBID_ENDPOINT=${GROBID_ENDPOINT:-http://grobid:8070}
      - GROBID_TIMEOUT=${GROBID_TIMEOUT:-180.0}
      - WORKER_RESULT_TTL=${WORKER_RESULT_TTL:-3600}
      - JOB_METADATA_TTL=${JOB_METADATA_TTL:-86400}
      - TIMEOUT_TEXT_EXTRACTION=${TIMEOUT_TEXT_EXTRACTION:-1500}
      - TIMEOUT_REFERENCE_EXTRACTION=${TIMEOUT_REFERENCE_EXTRACTION:-1500}
      - TIMEOUT_REFERENCE_PARSING=${TIMEOUT_REFERENCE_PARSING:-2700}
      - TIMEOUT_CITATION_LINKING=${TIMEOUT_CITATION_LINKING:-600}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-large-instruct}
      - EMBEDDING_ENDPOINT=${EMBEDDING_ENDPOINT:-http://localhost:7997/embeddings}
    volumes:
      - ./storage:/app/storage
      - ./prompts:/app/prompts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - citation-net
    restart: unless-stopped
    deploy:
      replicas: 6  # Increased for slow tasks! (was 2)

  # RQ Workers - Citation linking
  # Medium tasks (~1-3min), moderate replica count
  worker-linking:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m citation_index.worker --queues linking
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - STORAGE_ROOT=/app/storage
      - WORKER_RESULT_TTL=${WORKER_RESULT_TTL:-3600}
      - JOB_METADATA_TTL=${JOB_METADATA_TTL:-86400}
      - TIMEOUT_CITATION_LINKING=${TIMEOUT_CITATION_LINKING:-600}
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - citation-net
    restart: unless-stopped
    deploy:
      replicas: 2

  # RQ Dashboard - Web UI for monitoring queues
  rq-dashboard:
    image: eoranged/rq-dashboard:latest
    platform: linux/amd64  # Specify platform for Apple Silicon compatibility
    container_name: citation-index-dashboard
    ports:
      - "9181:9181"
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - citation-net
    restart: unless-stopped

volumes:
  redis_data:
    driver: local

networks:
  citation-net:
    driver: bridge
