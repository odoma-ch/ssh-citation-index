# Citation-linking decider (services/linking_decider): fine-tuned GLiNER2
# (yurui983/gliner2.5-multi-decide-citation-linking, mdeberta-v3-base, fp32) that
# picks, for one parsed reference and one index's search results, the matching
# record or none. The linking worker calls it for /link/references?method=model.
#
# Build and push (from the repo root):
#   docker build --platform linux/amd64 -f deployment/linking-decider.Dockerfile \
#     -t registry.paas.psnc.pl/graphia/linking-decider:0.5.1 .
#   docker push registry.paas.psnc.pl/graphia/linking-decider:0.5.1
#
# Weights are read from the shared PVC (citation-index-storage, models/), not the
# Hub, so no HF_TOKEN is needed and a restart does not download 1.1 GB. Copy a new
# checkpoint next to the old one, then point DECIDER_MODEL_PATH and the SHA/bias at it:
#   oc rsync <local>/v5_select_v1/best/ <any pod with the PVC>:/app/storage/models/linking-decider/v5_select_v1/
# To load from the Hub instead, drop DECIDER_MODEL_PATH (private repo: add HF_TOKEN
# to citation-index-secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linking-decider
  labels:
    app: linking-decider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linking-decider
  template:
    metadata:
      labels:
        app: linking-decider
    spec:
      imagePullSecrets:
        - name: reg-paas-cred
      containers:
        - name: linking-decider
          image: registry.paas.psnc.pl/graphia/linking-decider:0.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: citation-index-secret
                  key: HF_TOKEN
                  # Not needed once the model repo is public
                  optional: true
            # v5_select_v1, copied from the Hub revision below; the service refuses
            # weights whose SHA-256 differs from the validated checkpoint.
            - name: DECIDER_MODEL_PATH
              value: "/models/linking-decider/v5_select_v1"
            - name: DECIDER_MODEL_REVISION
              value: "09135525ae27a5b8af80929521163a5688f47c7e"  # v5_select_v1
            - name: DECIDER_MODEL_SHA256
              value: "76520c5682ef86290a75c30d734aa1750ac42e15d1b711d80f6d1ed3561c8930"
            # Selected on validation for these weights; change only with new
            # weights (and DECIDER_MODEL_SHA256).
            - name: DECIDER_NONE_LOGIT_BIAS
              value: "-3.217"
            # Torch sizes its thread pool from the node's cores, not the cgroup
            # quota; keep equal to the CPU limit to avoid CFS throttling.
            - name: OMP_NUM_THREADS
              value: "4"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /models
              subPath: models
              readOnly: true
          # The model load (1.1 GB from the PVC) runs before the app answers.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          # /health does not wait for the inference lock, so it stays
          # responsive while a request is being scored.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          # One task is ~0.1-0.7s on 2 threads (Apple M-series bench); peak RSS
          # ~3.5 GB. Re-measure on the cluster before scaling.
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "4"
              memory: "6Gi"
              # The namespace quota counts ephemeral storage; weights live on the PVC.
              ephemeral-storage: "512Mi"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: models
          persistentVolumeClaim:
            claimName: citation-index-storage
---
apiVersion: v1
kind: Service
metadata:
  name: linking-decider
  labels:
    app: linking-decider
spec:
  selector:
    app: linking-decider
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
  type: ClusterIP
