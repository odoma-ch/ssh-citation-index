master:
  resources:
    limits:
      cpu: '500m'
      memory: '1Gi'
    requests:
      cpu: '250m'
      memory: '512Mi'
  podAnnotations:
    backup.velero.io/backup-volumes: redis-data
  persistence:
    enabled: true
    storageClass: "standard"
    size: 10Gi
  config:               # ADDED SECTION
    maxmemory-policy: allkeys-lru
    tls-cluster: yes
    requirepass: "yes"
  tls:
    enabled: true
    authClients: true
    autoGenerated: false
    existingSecret: "redis-certs"
auth:
  enabled: true
  existingSecret: "citation-index-redis-secret"
  existingSecretPasswordKey: "redis-password"

# kubectl create secret generic citation-index-redis-secret --from-literal=redis-password='...' -n graphia-app1-staging
# helm upgrade -i citation-index-redis oci://registry.paas.psnc.pl/helm/redis-simple -f redis.yaml