# ==========================================================
# 9. RQ Dashboard – Deployment
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citation-index-rq-dashboard
  labels:
    app: citation-index
    component: rq-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: citation-index
      component: rq-dashboard
  template:
    metadata:
      labels:
        app: citation-index
        component: rq-dashboard
    spec:
      imagePullSecrets:
        - name: registry-paas-psnc
      containers:
        - name: dashboard
          image: eoranged/rq-dashboard:latest
          ports:
            - containerPort: 9181
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: citation-index-redis-secret
                  key: redis-password
            - name: RQ_DASHBOARD_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@citation-index-redis-redis-simple-master:6379/0"
          resources:
            requests:
              cpu: "100m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
# ==========================================================
# 10. RQ Dashboard – Service
# ==========================================================
apiVersion: v1
kind: Service
metadata:
  name: citation-index-rq-dashboard
  labels:
    app: citation-index
    component: rq-dashboard
spec:
  selector:
    app: citation-index
    component: rq-dashboard
  ports:
    - port: 9181
      targetPort: 9181
      protocol: TCP
  type: ClusterIP
---
# ==========================================================
# 11. RQ Dashboard – Route (OKD / OpenShift)
# ==========================================================
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: citation-index-rq-dashboard
  labels:
    app: citation-index
    component: rq-dashboard
spec:
  to:
    kind: Service
    name: citation-index-rq-dashboard
    weight: 100
  port:
    targetPort: 9181
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
